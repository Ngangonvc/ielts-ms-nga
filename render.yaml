services:
  - type: web
    name: ielts-ms-nga
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_START_TUNNEL
        value: "false"
